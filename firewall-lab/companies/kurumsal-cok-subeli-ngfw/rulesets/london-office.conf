# ==============================================================================
# LONDRA OFISI (UK HUB) - PALO ALTO PA-1410 NGFW KURAL SETI (RULESET)
# Kapsam: Idari/Satis (60), Yazilim (45), Ar-Ge (25), Teknik/CloudOps (15)
# Odak: UK-GDPR Veri Koruma (DLP), AWS/Azure UK Cloud Erisimi ve Istanbul VPN
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. AG NESNELERI (ADDRESS OBJECTS)
# ------------------------------------------------------------------------------
set address LON_VLAN10_IDARI ip-netmask 10.30.10.0/24
set address LON_VLAN20_YAZILIM ip-netmask 10.30.20.0/24
set address LON_VLAN30_ARGE ip-netmask 10.30.30.0/24
set address LON_VLAN99_CLOUDOPS ip-netmask 10.30.99.0/24
set address IST_HQ_GITLAB_CICD ip-netmask 10.10.100.0/24
set address AWS_EU_WEST2_VPC ip-netmask 172.25.0.0/16

# ------------------------------------------------------------------------------
# 2. UK-GDPR VERI KORUMA VE GUVENLIK PROFILLERI
# ------------------------------------------------------------------------------
# UK-GDPR geregi kredi karti, UK National Insurance Number ve PII verilerinin
# Avrupa/UK disina (VPN dahil) kontrolsuz cikisini engelleyen DLP profili.
set profile-group PG_UK_GDPR_STRICT antivirus AV_STRICT spyware AS_STRICT vulnerability VP_STRICT url-filtering URL_UK_COMPLIANCE data-filtering DLP_GDPR_PII_BLOCK wildfire WF_INLINE

# ------------------------------------------------------------------------------
# 3. GUVENLIK DUVARI KURALLARI (SECURITY POLICY RULESET)
# ------------------------------------------------------------------------------

# [KURAL 01] UK-GDPR VERI EGEMENLIGI KURALI (PII VERISININ ULUSLARARASI VPN'E CIKISINI DENETLE)
set rulebase security rules "01-GDPR-CHECK-CROSS-BORDER-VPN" from [ LON-CORP LON-SWE LON-RND ] to VPN-ISTANBUL source any destination any application any service application-default action allow profile-setting group PG_UK_GDPR_STRICT log-end yes

# [KURAL 02] LONDRA YAZILIM & CLOUDOPS (60 Kisi) -> AWS UK (eu-west-2) DIRECT CONNECT / VPN
set rulebase security rules "02-LON-SWE-TO-AWS-UK" from [ LON-SWE LON-MGMT ] to CLOUD-AWS-UK source [ LON_VLAN20_YAZILIM LON_VLAN99_CLOUDOPS ] destination AWS_EU_WEST2_VPC application [ ssh ssl aws-console-base kubernetes docker ] service application-default action allow profile-setting group PG_UK_GDPR_STRICT log-end yes

# [KURAL 03] LONDRA YAZILIM & AR-GE -> ISTANBUL MERKEZ GITLAB REPO ERISIMI
set rulebase security rules "03-LON-DEV-TO-IST-GITLAB" from [ LON-SWE LON-RND ] to VPN-ISTANBUL source [ LON_VLAN20_YAZILIM LON_VLAN30_ARGE ] destination IST_HQ_GITLAB_CICD application [ git ssh ssl ] service application-default action allow profile-setting group PG_UK_GDPR_STRICT log-end yes

# [KURAL 04] LONDRA AR-GE (25 Kisi) -> IC AG IZOLASYONU (ZERO-TRUST)
set rulebase security rules "04-LON-ARGE-ISOLATION" from LON-RND to LON-CORP source LON_VLAN30_ARGE destination LON_VLAN10_IDARI application any service any action deny log-end yes

# [KURAL 05] UZAKTAN CALISANLAR (GLOBALPROTECT ZTNA) -> SADECE HIP CHECK GECEN CIHAZLAR
# Cihazin disk sifrelemesi (BitLocker/FileVault) ve CrowdStrike/Defender EDR ajani aktif degilse erisim reddedilir.
set rulebase security rules "05-ZTNA-REMOTE-WORKERS" from VPN-GLOBALPROTECT to [ LON-SWE LON-CORP CLOUD-AWS-UK ] source any destination any source-hip [ HIP_DISK_ENCRYPTED HIP_EDR_ACTIVE ] application [ ssl ssh ms-teams office365-enterprise-access ] service application-default action allow profile-setting group PG_UK_GDPR_STRICT log-end yes

# [KURAL 06] STANDART KURUMSAL INTERNET CIKISI
set rulebase security rules "06-LON-CORP-INTERNET" from [ LON-CORP LON-SWE LON-RND ] to UNTRUST source any destination any application [ web-browsing ssl ms-teams zoom slack-base ] service application-default action allow profile-setting group PG_UK_GDPR_STRICT log-end yes

# [KURAL 99] IMPLICIT DENY & LOG ALL
set rulebase security rules "99-CLEANUP-DENY-ALL" from any to any source any destination any application any service any action drop log-start yes log-end yes

