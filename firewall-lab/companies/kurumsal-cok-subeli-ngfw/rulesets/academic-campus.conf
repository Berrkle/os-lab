# ==============================================================================
# AKADEMIK SUBE (KAMPUS) - FORTINET FORTIGATE 2600F NGFW KURAL SETI (FORTIOS)
# Kapsam: 10.000 Ogrenci, 450 Akademisyen (Hoca), 350 Idari, 60 Ar-Ge, 40 Yazilim, 50 IT
# Toplam Bant Genisligi: 30 Gbps (20 Gbps ULAKBIM + 10 Gbps Ticari ISP)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ALT AG VE GRUPLAR (ADDRESS OBJECTS)
# ------------------------------------------------------------------------------
config firewall address
    edit "KAMPUS_OGRENCI_WIFI_10K"
        set subnet 10.40.0.0 255.255.0.0
        set comment "10.000 Ogrenci BYOD Wi-Fi Agi"
    next
    edit "KAMPUS_OGRENCI_LAB_PCS"
        set subnet 10.42.0.0 255.255.252.0
        set comment "600 Adet Bilgisayar Laboratuvari PC"
    next
    edit "KAMPUS_AKADEMISYEN_NET"
        set subnet 10.43.0.0 255.255.252.0
        set comment "450 Ogretim Uyesi / Hoca Agi"
    next
    edit "KAMPUS_IDARI_PERSONEL"
        set subnet 10.44.0.0 255.255.254.0
        set comment "350 Idari Personel (Ogrenci Isleri, Finans vb.)"
    next
    edit "KAMPUS_ARGE_TEKNOKENT"
        set subnet 10.45.0.0 255.255.255.0
        set comment "60 Kisilik Akademik Ar-Ge Ekibi"
    next
    edit "KAMPUS_YAZILIM_EKIBI"
        set subnet 10.46.0.0 255.255.255.0
        set comment "40 Kisilik OBS/LMS Yazilim Gelistirme Ekibi"
    next
    edit "KAMPUS_IT_MGMT"
        set subnet 10.49.99.0 255.255.255.0
        set comment "50 Kisilik Kampus Sistem ve Ag Ekibi"
    next
    edit "SRV_OBS_LMS_PORTAL"
        set subnet 10.50.0.10 255.255.255.255
        set comment "Ogrenci Bilgi Sistemi ve Online Sinav Sunucusu"
    next
    edit "SRV_KAMPUS_DB_CLUSTER"
        set subnet 10.50.0.50 255.255.255.255
        set comment "Not ve Ogrenci Veritabani (Yuksek Koruma)"
    next
end

# ------------------------------------------------------------------------------
# 2. BANT GENISLIGI LIMITLERI (TRAFFIC SHAPERS - QoS)
# ------------------------------------------------------------------------------
config firewall shaper per-ip-shaper
    edit "SHAPER-OGRENCI-PER-IP-15M"
        set max-bandwidth 15360
        set max-concurrent-session 200
        set comment "Her ogrenci cihazi icin maksimum 15 Mbps ve 200 oturum limiti"
    next
    edit "SHAPER-AKADEMISYEN-PER-IP-100M"
        set max-bandwidth 102400
        set comment "Her akademisyen icin 100 Mbps limit"
    next
end

config firewall shaper traffic-shaper
    edit "POOL-OGRENCI-TOTAL-18G"
        set guaranteed-bandwidth 13000000
        set maximum-bandwidth 18000000
        set priority low
        set comment "10.000 Ogrenci toplam havuzu: 13 Gbps garanti, 18 Gbps tavan"
    next
    edit "POOL-AKADEMIK-ARGE-10G"
        set guaranteed-bandwidth 6000000
        set maximum-bandwidth 10000000
        set priority high
    next
end

# ------------------------------------------------------------------------------
# 3. UYGULAMA KONTROLU (APPLICATION CONTROL - OGRENCI KISITLAMALARI)
# ------------------------------------------------------------------------------
config application list
    edit "APP-CTRL-OGRENCI-STRICT"
        set comment "Torrent, P2P, Kripto Madenciligi ve Proxy/VPN Bypass Engelleme"
        config entries
            edit 1
                set category 2 6 # P2P (BitTorrent) ve Anonymous Proxy/VPN
                set action block
            next
            edit 2
                set application 41550 # Crypto-Mining Pools
                set action block
            next
        end
    next
end

# ------------------------------------------------------------------------------
# 4. GUVENLIK DUVARI KURALLARI (SECURITY POLICIES)
# ------------------------------------------------------------------------------
config firewall policy

    # [KURAL 1] OGRENCILERIN (10.000 Kisi) VERITABANI, IDARI AG VE HOCALARIN AGINA ERISIM YASAGI
    # Ogrencilerin not veritabanina veya idari bilgisayarlara dogrudan paket gondermesini engeller.
    edit 1
        set name "01-BLOCK-STUDENTS-TO-CRITICAL-ZONES"
        set srcintf "vlan400-student-wifi" "vlan420-student-lab"
        set dstintf "vlan430-faculty" "vlan440-admin" "vlan450-arge" "vlan460-swe" "vlan499-it"
        set srcaddr "KAMPUS_OGRENCI_WIFI_10K" "KAMPUS_OGRENCI_LAB_PCS"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # [KURAL 2] OGRENCILERIN SADECE HTTPS (443) ILE OBS VE SINAV SISTEMINE ERISIMI (WAF + IPS AKTIF)
    # Ogrenci OBS'ye girerken SQL Injection veya XSS denemesi yaparsa IPS/WAF tarafindan aninda bloklanir.
    edit 2
        set name "02-STUDENTS-TO-OBS-LMS-HTTPS-ONLY"
        set srcintf "vlan400-student-wifi" "vlan420-student-lab"
        set dstintf "vlan500-datacenter"
        set srcaddr "KAMPUS_OGRENCI_WIFI_10K" "KAMPUS_OGRENCI_LAB_PCS"
        set dstaddr "SRV_OBS_LMS_PORTAL"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "high_security"
        set waf-profile "WAF-OBS-PROTECTION"
        set logtraffic all
    next

    # [KURAL 3] OGRENCILERIN VERITABANI SUNUCUSUNA DOGRUDAN ERISIM YASAGI
    edit 3
        set name "03-BLOCK-STUDENTS-TO-DB-DIRECT"
        set srcintf "vlan400-student-wifi" "vlan420-student-lab"
        set dstintf "vlan500-datacenter"
        set srcaddr "all"
        set dstaddr "SRV_KAMPUS_DB_CLUSTER"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # [KURAL 4] 10.000 OGRENCI -> INTERNET CIKISI (QoS 15 Mbps/Kisi + 5651 CGNAT LOGLAMA + P2P ENGEL)
    edit 4
        set name "04-STUDENTS-10K-INTERNET-ACCESS"
        set srcintf "vlan400-student-wifi" "vlan420-student-lab"
        set dstintf "wan-ulakbim-20g" "wan-isp-10g"
        set srcaddr "KAMPUS_OGRENCI_WIFI_10K" "KAMPUS_OGRENCI_LAB_PCS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "QUIC"
        set utm-status enable
        set av-profile "default"
        set webfilter-profile "WF-STUDENT-SAFE-SEARCH"
        set application-list "APP-CTRL-OGRENCI-STRICT"
        set ips-sensor "default"
        set traffic-shaper "POOL-OGRENCI-TOTAL-18G"
        set per-ip-shaper "SHAPER-OGRENCI-PER-IP-15M"
        set nat enable
        set ippool enable
        set poolname "CGNAT-POOL-5651-STUDENTS"
        set logtraffic all
    next

    # [KURAL 5] AKADEMISYENLER (450 Hoca) -> AKADEMIK VERITABANLARI VE INTERNET (YUKSEK ONCELIK)
    edit 5
        set name "05-FACULTY-ACADEMIC-INTERNET"
        set srcintf "vlan430-faculty"
        set dstintf "wan-ulakbim-20g"
        set srcaddr "KAMPUS_AKADEMISYEN_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set traffic-shaper "POOL-AKADEMIK-ARGE-10G"
        set per-ip-shaper "SHAPER-AKADEMISYEN-PER-IP-100M"
        set nat enable
        set logtraffic utm
    next

    # [KURAL 6] AKADEMISYENLER -> OBS NOT GIRIS SISTEMI (MFA ZORUNLU)
    edit 6
        set name "06-FACULTY-TO-OBS-GRADE-ENTRY"
        set srcintf "vlan430-faculty"
        set dstintf "vlan500-datacenter"
        set srcaddr "KAMPUS_AKADEMISYEN_NET"
        set dstaddr "SRV_OBS_LMS_PORTAL"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set groups "LDAP_FACULTY_MFA_ENABLED"
        set utm-status enable
        set ips-sensor "high_security"
        set logtraffic all
    next

    # [KURAL 7] KAMPUS YAZILIM EKIBI (40 Kisi) & AR-GE (60 Kisi) -> ISTANBUL MERKEZ GIT/AR-GE TUNELI
    edit 7
        set name "07-CAMPUS-SWE-RND-TO-ISTANBUL-HQ"
        set srcintf "vlan450-arge" "vlan460-swe"
        set dstintf "ipsec-to-istanbul-hq"
        set srcaddr "KAMPUS_ARGE_TEKNOKENT" "KAMPUS_YAZILIM_EKIBI"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SSH" "HTTPS" "GIT"
        set utm-status enable
        set ips-sensor "high_security"
        set logtraffic all
    next

    # [KURAL 8] KAMPUS TEKNIK/IT EKIBI (50 Kisi) -> VERI MERKEZI YONETIMI
    edit 8
        set name "08-CAMPUS-IT-TO-DATACENTER"
        set srcintf "vlan499-it"
        set dstintf "vlan500-datacenter"
        set srcaddr "KAMPUS_IT_MGMT"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SSH" "RDP" "HTTPS" "SNMP"
        set utm-status enable
        set ips-sensor "high_security"
        set logtraffic all
    next

    # [KURAL 99] IMPLICIT DENY & LOG ALL
    edit 99
        set name "99-EXPLICIT-DENY-LOG"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

