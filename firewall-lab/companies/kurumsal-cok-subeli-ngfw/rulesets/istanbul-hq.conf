# ==============================================================================
# ISTANBUL MERKEZ OFIS (HQ) - PALO ALTO PA-5410 NGFW KURAL SETI (RULESET)
# Kapsam: Idari Personel (220), Yazilim Ekibi (180), Ar-Ge Ekibi (90), IT/SOC (45)
# Mimari: Zero-Trust Zone-Based Policy (En Az Yetki Prensibi - Least Privilege)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. AG NESNELERI VE ALT AGLAR (ADDRESS OBJECTS)
# ------------------------------------------------------------------------------
set address VLAN10_IDARI_NET ip-netmask 10.10.10.0/24
set address VLAN20_YAZILIM_NET ip-netmask 10.10.20.0/23
set address VLAN30_ARGE_NET ip-netmask 10.10.30.0/24
set address VLAN99_IT_SOC_MGMT ip-netmask 10.10.99.0/24
set address VLAN100_INTERNAL_DC ip-netmask 10.10.100.0/24
set address VLAN110_DMZ_SERVERS ip-netmask 172.16.10.0/24
set address VLAN200_GUEST_WIFI ip-netmask 172.16.200.0/24

# Uzak Subeler (Site-to-Site VPN)
set address ANKARA_OFIS_SUMMARY ip-netmask 10.20.0.0/16
set address LONDRA_OFIS_SUMMARY ip-netmask 10.30.0.0/16
set address AKADEMIK_KAMPUS_SUMMARY ip-netmask 10.40.0.0/14

# Kritik Sunucular
set address SRV_GITLAB_INTERNAL ip-netmask 10.10.100.15/32
set address SRV_CI_CD_RUNNER ip-netmask 10.10.100.16/32
set address SRV_ARGE_AI_CLUSTER ip-netmask 10.10.100.50/32
set address SRV_SIEM_COLLECTOR ip-netmask 10.10.99.10/32
set address SRV_JUMP_BASTION ip-netmask 10.10.99.20/32

# ------------------------------------------------------------------------------
# 2. GUVENLIK PROFILLERI (THREAT PREVENTION, DLP, URL FILTERING)
# ------------------------------------------------------------------------------
set profile-group PG_STRICT_ARGE antivirus AV_STRICT spyware AS_STRICT vulnerability VP_STRICT url-filtering URL_BLOCK_FILE_SHARING file-blocking FB_BLOCK_SOURCE_CODE_EXFIL wildfire WF_INLINE
set profile-group PG_DEVELOPER antivirus AV_DEFAULT spyware AS_STRICT vulnerability VP_STRICT url-filtering URL_DEV_ALLOWED file-blocking FB_STANDARD wildfire WF_INLINE
set profile-group PG_CORPORATE antivirus AV_DEFAULT spyware AS_DEFAULT vulnerability VP_DEFAULT url-filtering URL_CORP_STANDARD file-blocking FB_STRICT

# ------------------------------------------------------------------------------
# 3. GUVENLIK DUVARI KURALLARI (SECURITY POLICY RULESET)
# ------------------------------------------------------------------------------

# [KURAL 01] ANTI-SPOOFING VE ZARARLI IP ENGELLEME (EN USTTE)
set rulebase security rules "01-BLOCK-MALICIOUS-FEEDS" from UNTRUST to any source [ EDL_KNOWN_BOTNETS EDL_TOR_EXIT_NODES EDL_RANSOMWARE_C2 ] destination any application any service any action drop log-end yes

# [KURAL 02] IT & SOC EKIBI (45 Kisi) -> SADECE BASTION/JUMP HOST UZERINDEN YONETIM
set rulebase security rules "02-IT-SOC-TO-BASTION" from TRUST-MGMT to TRUST-DC source VLAN99_IT_SOC_MGMT destination SRV_JUMP_BASTION application [ ssh rdp ssl ] service application-default action allow profile-setting group PG_CORPORATE log-end yes

# [KURAL 03] YAZILIM EKIBI (180 Kisi) -> IC GITLAB VE CI/CD ERISIMI
set rulebase security rules "03-SWE-TO-INTERNAL-GIT-CICD" from TRUST-SWE to TRUST-DC source VLAN20_YAZILIM_NET destination [ SRV_GITLAB_INTERNAL SRV_CI_CD_RUNNER ] application [ git ssh ssl web-browsing ] service application-default action allow profile-setting group PG_DEVELOPER log-end yes

# [KURAL 04] YAZILIM EKIBI -> DIS BULUT & PAKET DEPOLARI (GITHUB, DOCKER, NPM, AWS)
# Not: Sadece onayli gelistirici uygulamalarina izin verilir, genel dosya paylasim siteleri engellenir.
set rulebase security rules "04-SWE-INTERNET-DEV-TOOLS" from TRUST-SWE to UNTRUST source VLAN20_YAZILIM_NET destination any application [ github-base docker npm-registry pypi-base aws-console-base google-cloud-platform ssl apt-get ] service application-default action allow profile-setting group PG_DEVELOPER log-end yes

# [KURAL 05] AR-GE EKIBI (90 Kisi) -> AI/ML HESAPLAMA KUMESI ERISIMI (IZOLE)
set rulebase security rules "05-ARGE-TO-AI-CLUSTER" from TRUST-RND to TRUST-DC source VLAN30_ARGE_NET destination SRV_ARGE_AI_CLUSTER application [ ssh ssl jupyter-notebook ] service application-default action allow profile-setting group PG_STRICT_ARGE log-end yes

# [KURAL 06] AR-GE EKIBI -> YAZILIM VEYA IDARI AGA DOGRUDAN ERISIM YASAGI (MIKRO-SEGMENTASYON)
# Ar-Ge laboratuvarindaki olasi bir prototip zafiyetinin kurumsal aga yayilmasini onler.
set rulebase security rules "06-ISOLATE-ARGE-LATERAL" from TRUST-RND to [ TRUST-CORP TRUST-SWE VLAN200_GUEST_WIFI ] source VLAN30_ARGE_NET destination any application any service any action deny log-end yes

# [KURAL 07] AR-GE EKIBI -> KONTROLLU INTERNET ERISIMI (DLP AKTIF - VERI SIZINTISI ONLEME)
# Ar-Ge personeli akademik kaynaklara erisebilir ancak WeTransfer, Google Drive, Kisisel GitHub vb. upload yapamaz.
set rulebase security rules "07-ARGE-RESTRICTED-INTERNET" from TRUST-RND to UNTRUST source VLAN30_ARGE_NET destination any application [ web-browsing ssl ieee-xplore arxiv ] service application-default action allow profile-setting group PG_STRICT_ARGE log-end yes

# [KURAL 08] ANKARA AR-GE VE ISTANBUL AR-GE ARASI SIFRELI VERI PAYLASIMI (IPSEC VPN)
set rulebase security rules "08-HQ-TO-ANKARA-RND-SYNC" from TRUST-RND to VPN-BRANCHES source VLAN30_ARGE_NET destination 10.20.30.0/24 application [ git ssl ssh ] service application-default action allow profile-setting group PG_STRICT_ARGE log-end yes

# [KURAL 09] IDARI PERSONEL (220 Kisi) -> KURUMSAL UYGULAMALAR VE INTERNET
set rulebase security rules "09-CORP-USERS-INTERNET" from TRUST-CORP to UNTRUST source VLAN10_IDARI_NET destination any application [ ms-teams zoom office365-enterprise-access web-browsing ssl ] service application-default action allow profile-setting group PG_CORPORATE log-end yes

# [KURAL 10] MISAFIR AGI -> SADECE HTTP/HTTPS VE DNS (IC AGA ERISIM KESINLIKLE YASAK)
set rulebase security rules "10-GUEST-BLOCK-INTERNAL" from GUEST to [ TRUST-CORP TRUST-SWE TRUST-RND TRUST-DC TRUST-MGMT VPN-BRANCHES ] source VLAN200_GUEST_WIFI destination any application any service any action drop log-end yes
set rulebase security rules "11-GUEST-INTERNET-ONLY" from GUEST to UNTRUST source VLAN200_GUEST_WIFI destination any application [ web-browsing ssl dns ] service application-default action allow log-end yes

# [KURAL 12] TUM AG CİHAZLARINDAN MERKEZI SIEM SUNUCUSUNA LOG AKISI
set rulebase security rules "12-ALL-ZONES-TO-SIEM" from any to TRUST-MGMT source any destination SRV_SIEM_COLLECTOR application [ syslog snmpv3 netflow ] service application-default action allow log-end no

# [KURAL 99] IMPLICIT DENY & LOG ALL (VARSAYILAN ENGELLEME VE KAYIT)
set rulebase security rules "99-CLEANUP-DENY-ALL" from any to any source any destination any application any service any action drop log-start yes log-end yes

