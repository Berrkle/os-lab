# ==============================================================================
# ANKARA OFISI - FORTINET FORTIGATE 1000F NGFW KURAL SETI (FORTIOS CLI)
# Kapsam: Idari (85), Yazilim (95), Ar-Ge (110), Teknik/IT (25) + DR Veri Merkezi
# Odak: Yüksek Guvenlikli Ar-Ge Izolasyonu, Kamu G2B VPN ve Istanbul DR Senkronizasyonu
# ==============================================================================

config firewall address
    edit "ANK_VLAN10_IDARI"
        set subnet 10.20.10.0 255.255.255.0
    next
    edit "ANK_VLAN20_YAZILIM"
        set subnet 10.20.20.0 255.255.255.0
    next
    edit "ANK_VLAN30_ARGE_LAB"
        set subnet 10.20.30.0 255.255.255.0
    next
    edit "ANK_VLAN99_TEKNIK_IT"
        set subnet 10.20.99.0 255.255.255.0
    next
    edit "ANK_VLAN100_DR_SERVERS"
        set subnet 10.20.100.0 255.255.255.0
    next
    edit "IST_HQ_DC_SUBNET"
        set subnet 10.10.100.0 255.255.255.0
    next
    edit "IST_HQ_ARGE_SUBNET"
        set subnet 10.10.30.0 255.255.255.0
    next
end

# ------------------------------------------------------------------------------
# GUVENLIK PROFILLERI (IPS, ANTIVIRUS, DLP)
# ------------------------------------------------------------------------------
config ips sensor
    edit "IPS-ANKARA-HIGH-SEC"
        set comment "Ar-Ge ve DR Sunuculari Icin Siki IPS Profili"
        config entries
            edit 1
                set severity medium high critical
                set action block
                set log-packet enable
            next
        end
    next
end

config dlp sensor
    edit "DLP-ARGE-NO-EXFIL"
        set comment "Kaynak Kod ve Teknik Dokuman Sizintisini Engeller"
        config filter
            edit 1
                set proto http-post smtp Pop3 Imap
                set filter-by file-type
                set file-type 3 # Kaynak kod ve arsiv dosyalari
                set action block
            next
        end
    next
end

# ------------------------------------------------------------------------------
# FIREWALL POLITIKALARI (SECURITY POLICIES)
# ------------------------------------------------------------------------------
config firewall policy
    # [KURAL 1] ISTANBUL MERKEZ -> ANKARA DR MERKEZI REPGIKASYON (IPSEC TUNNEL)
    edit 1
        set name "01-IST-TO-ANK-DR-REPLICATION"
        set srcintf "ipsec-to-istanbul"
        set dstintf "vlan100-dr"
        set srcaddr "IST_HQ_DC_SUBNET"
        set dstaddr "ANK_VLAN100_DR_SERVERS"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "MS-SQL" "POSTGRESQL" "VMWARE-VR"
        set utm-status enable
        set ips-sensor "IPS-ANKARA-HIGH-SEC"
        set logtraffic all
    next

    # [KURAL 2] ANKARA AR-GE (110 Kisi) <-> ISTANBUL AR-GE ORTAK PROJE ERISIMI
    edit 2
        set name "02-ANK-ARGE-TO-IST-ARGE"
        set srcintf "vlan30-arge"
        set dstintf "ipsec-to-istanbul"
        set srcaddr "ANK_VLAN30_ARGE_LAB"
        set dstaddr "IST_HQ_ARGE_SUBNET"
        set action accept
        set schedule "always"
        set service "SSH" "HTTPS" "GIT"
        set utm-status enable
        set ips-sensor "IPS-ANKARA-HIGH-SEC"
        set dlp-sensor "DLP-ARGE-NO-EXFIL"
        set logtraffic all
    next

    # [KURAL 3] ANKARA AR-GE -> YEREL AG (IDARI VE MISAFIR) IZOLASYONU
    edit 3
        set name "03-BLOCK-ARGE-TO-CORP-LATERAL"
        set srcintf "vlan30-arge"
        set dstintf "vlan10-idari" "vlan200-guest"
        set srcaddr "ANK_VLAN30_ARGE_LAB"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # [KURAL 4] ANKARA AR-GE -> KONTROLLU DIS INTERNET (DLP VE SSL DEEP INSPECTION ZORUNLU)
    edit 4
        set name "04-ANK-ARGE-RESTRICTED-WEB"
        set srcintf "vlan30-arge"
        set dstintf "virtual-wan-link"
        set srcaddr "ANK_VLAN30_ARGE_LAB"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set ips-sensor "IPS-ANKARA-HIGH-SEC"
        set dlp-sensor "DLP-ARGE-NO-EXFIL"
        set webfilter-profile "WF-ARGE-WHITELIST-ONLY"
        set logtraffic all
    next

    # [KURAL 5] YAZILIM EKIBI (95 Kisi) -> GELISTIRICI ARACLARI VE ISTANBUL GITLAB
    edit 5
        set name "05-ANK-SWE-TO-IST-GITLAB"
        set srcintf "vlan20-yazilim"
        set dstintf "ipsec-to-istanbul"
        set srcaddr "ANK_VLAN20_YAZILIM"
        set dstaddr "IST_HQ_DC_SUBNET"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "GIT"
        set utm-status enable
        set ips-sensor "IPS-ANKARA-HIGH-SEC"
        set logtraffic all
    next

    # [KURAL 6] TEKNIK EKIP (25 Kisi) -> ALTYAPI YONETIMI (MFA ZORUNLU)
    edit 6
        set name "06-ANK-IT-ADMIN-ACCESS"
        set srcintf "vlan99-teknik"
        set dstintf "vlan100-dr"
        set srcaddr "ANK_VLAN99_TEKNIK_IT"
        set dstaddr "ANK_VLAN100_DR_SERVERS"
        set action accept
        set schedule "always"
        set service "SSH" "RDP" "HTTPS"
        set groups "FSSO_ANKARA_IT_ADMINS"
        set utm-status enable
        set ips-sensor "IPS-ANKARA-HIGH-SEC"
        set logtraffic all
    next

    # [KURAL 7] IDARI PERSONEL (85 Kisi) -> STANDART KURUMSAL INTERNET
    edit 7
        set name "07-ANK-IDARI-INTERNET"
        set srcintf "vlan10-idari"
        set dstintf "virtual-wan-link"
        set srcaddr "ANK_VLAN10_IDARI"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set av-profile "default"
        set webfilter-profile "WF-CORP-STANDARD"
        set ips-sensor "default"
        set nat enable
        set logtraffic utm
    next

    # [KURAL 99] VARSAYILAN ENGELLEME VE LOGLAMA
    edit 99
        set name "99-EXPLICIT-DENY-LOG"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

