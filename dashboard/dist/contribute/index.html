authorized in writing to assess, inside isolated labs. Do not\ncontribute content, artifacts or examples taken from systems you were not\nauthorized to test. See the &lt;a href=\&quot;/legal/acceptable-use/\&quot;&gt;Acceptable Use Policy&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;No third-party binaries or proprietary media.&lt;/strong&gt; Do not commit APKs you do\nnot own, Windows or macOS images, Google’s platform-tools or other vendor\nbinaries. Download them at setup time from the vendor instead (see\n&lt;code&gt;android-lab/lab/scripts/get_platform_tools.py&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Compatible licences only.&lt;/strong&gt; New dependencies must have a licence compatible\nwith Apache-2.0 and must be added to the\n&lt;a href=\&quot;/legal/third-party/\&quot;&gt;Third-Party Notices&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;No secrets or personal data&lt;/strong&gt; in code, tests, fixtures or screenshots.&lt;/li&gt;\n&lt;li&gt;Be respectful: see the &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/CODE_OF_CONDUCT.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Code of Conduct&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Found a vulnerability in os-lab itself? Follow the &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/SECURITY.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Security Policy&lt;/a&gt;;\ndo &lt;strong&gt;not&lt;/strong&gt; open a public issue.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;step-1-set-up\&quot;&gt;Step 1: Set up&lt;/h2&gt;\n&lt;p&gt;You need git, Python 3.11 or newer and bash (Linux, macOS or WSL2). Node.js 22+\nis only needed to work on the dashboard.&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; clone&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; https://github.com/&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;&amp;lt;&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;yo&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;u&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;&amp;gt;&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;/os-lab&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;   # your fork&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;cd&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; os-lab&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; remote&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; add&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; upstream&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; https://github.com/keyvanarasteh/os-lab&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./labctl&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; ui&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;                                  # the web console at http://127.0.0.1:5050&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;The one-command installers in &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/scripts/setup/README.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;&lt;code&gt;scripts/setup/&lt;/code&gt;&lt;/a&gt; also\nset up a virtualenv and the dashboard.&lt;/p&gt;\n&lt;h2 id=\&quot;step-2-create-a-branch\&quot;&gt;Step 2: Create a branch&lt;/h2&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; fetch&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; upstream&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;git&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; checkout&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; -b&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; feat/short-description&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; upstream/master&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;   # or fix/…, docs/…, chore/…&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Keep each pull request to one logical change.&lt;/p&gt;\n&lt;h2 id=\&quot;step-3-make-the-change\&quot;&gt;Step 3: Make the change&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Area&lt;/th&gt;\n&lt;th&gt;Where&lt;/th&gt;\n&lt;th&gt;Notes&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Android lab scripts&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;android-lab/lab/scripts/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Prefer the Python standard library; expose a &lt;code&gt;main()&lt;/code&gt; and importable helpers&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Frida hooks&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;android-lab/lab/hooks/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;One concern per file, with a header comment saying what it bypasses or traces and how to load it&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Web console API and lab engine&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;android-lab/lab/web_ui.py&lt;/code&gt;, &lt;code&gt;console/oslab.py&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lab actions must stay typed and validated; never accept command strings from the page&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Dashboard&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;dashboard/src/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Astro + React + Tailwind; run &lt;code&gt;npm run dev&lt;/code&gt; with the console on port 5050&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;VM labs&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;win-lab/&lt;/code&gt;, &lt;code&gt;linux-lab/&lt;/code&gt;, &lt;code&gt;ios-lab/&lt;/code&gt;, &lt;code&gt;labctl&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bash&lt;/code&gt; with &lt;code&gt;set -euo pipefail&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Windows lab script&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;android-lab/lab/lab.ps1&lt;/code&gt;, &lt;code&gt;scripts/setup/install.ps1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Must parse in Windows PowerShell 5.1 and PowerShell 7; keep &lt;strong&gt;UTF-8 with BOM&lt;/strong&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Legal documents&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;docs/legal/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Shown in the dashboard at &lt;code&gt;/legal/&lt;/code&gt;; every statement must match what the code does&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;For the Android lab runbook see &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/android-lab/lab/README.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;&lt;code&gt;android-lab/lab/README.md&lt;/code&gt;&lt;/a&gt;,\nfor Windows non-admin use &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/android-lab/lab/README-WINDOWS.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;&lt;code&gt;android-lab/lab/README-WINDOWS.md&lt;/code&gt;&lt;/a&gt;,\nand for iOS &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/ios-lab/README.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;&lt;code&gt;ios-lab/README.md&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\&quot;step-4-add-tests\&quot;&gt;Step 4: Add tests&lt;/h2&gt;\n&lt;p&gt;Add or update tests in &lt;code&gt;android-lab/lab/tests/&lt;/code&gt; for any change in behaviour.\nTests run offline: mock network calls and never download from the internet.&lt;/p&gt;\n&lt;h2 id=\&quot;step-5-run-the-checks\&quot;&gt;Step 5: Run the checks&lt;/h2&gt;\n&lt;p&gt;GitHub Actions is disabled for this repository; the local runner replaces CI.\nRun it before every pull request:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./scripts/run-tests.sh&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;          # everything&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;./scripts/run-tests.sh&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; --quick&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;  # unit tests only&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;It runs the pytest suite, a sample-analysis smoke test, &lt;code&gt;bash -n&lt;/code&gt; on every\nshell script, &lt;code&gt;lat check&lt;/code&gt; when &lt;code&gt;lat&lt;/code&gt; is installed, and, when\n&lt;code&gt;dashboard/node_modules&lt;/code&gt; exists, the dashboard typecheck plus a check that the\ncommitted build is current.&lt;/p&gt;\n&lt;h2 id=\&quot;step-6-rebuild-the-dashboard-if-you-changed-it\&quot;&gt;Step 6: Rebuild the dashboard if you changed it&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;dashboard/dist/&lt;/code&gt; is committed so hosts without Node.js still get the\ndashboard. After changing anything in &lt;code&gt;dashboard/src/&lt;/code&gt; or &lt;code&gt;docs/legal/&lt;/code&gt;:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt;cd&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; dashboard&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;npm&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; ci&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;npm&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; run&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; check&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;npm&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; run&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; build&lt;/span&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;      # refreshes dashboard/dist; commit it with your change&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h2 id=\&quot;step-7-update-the-docs-and-the-knowledge-graph\&quot;&gt;Step 7: Update the docs and the knowledge graph&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Update the README of the area you changed.&lt;/li&gt;\n&lt;li&gt;If you changed architecture, behaviour or tests, update the knowledge graph in\n&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/tree/master/lat.md/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;&lt;code&gt;lat.md/&lt;/code&gt;&lt;/a&gt; (what the project does and why, not a changelog) and run\n&lt;code&gt;lat check&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If you changed what data is stored or sent, or added a dependency, update\n&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/tree/master/docs/legal/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;&lt;code&gt;docs/legal/&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;step-8-commit-and-open-a-pull-request\&quot;&gt;Step 8: Commit and open a pull request&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Commit with &lt;a href=\&quot;https://www.conventionalcommits.org/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Conventional Commits&lt;/a&gt;,\nfor example &lt;code&gt;fix(android): …&lt;/code&gt;, &lt;code&gt;feat(dashboard): …&lt;/code&gt;, &lt;code&gt;docs: …&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Push to your fork and open a pull request against &lt;code&gt;master&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Fill in the &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/.github/PULL_REQUEST_TEMPLATE.md\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;pull request template&lt;/a&gt;,\nincluding how you tested the change.&lt;/li&gt;\n&lt;li&gt;Respond to review comments; maintainers merge once the checks pass and the\nreview is done.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;reporting-bugs-and-requesting-features\&quot;&gt;Reporting bugs and requesting features&lt;/h2&gt;\n&lt;p&gt;Use the &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/tree/master/.github/ISSUE_TEMPLATE/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;issue templates&lt;/a&gt;. For open-ended questions,\nopen a &lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/discussions\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Discussion&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\&quot;licence\&quot;&gt;Licence&lt;/h2&gt;\n&lt;p&gt;By contributing, you agree that your contributions are licensed under the\n&lt;a href=\&quot;https://github.com/keyvanarasteh/os-lab/blob/master/LICENSE\&quot; target=\&quot;_blank\&quot; rel=\&quot;noreferrer\&quot;&gt;Apache License 2.0&lt;/a&gt;, the licence that covers this project.&lt;/p&gt;\n&quot;]}" ssr client="only" opts="{&quot;name&quot;:&quot;ContributePage&quot;,&quot;value&quot;:&quot;react&quot;}"></astro-island></body></html>
