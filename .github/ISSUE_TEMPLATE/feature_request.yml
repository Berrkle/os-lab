name: ✨ Feature Request
description: Suggest a new capability, workflow, or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve os-lab! Describe the capability you'd like to see.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing issues and discussions for a similar request.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Android lab (lab/)
        - iOS lab (ios-lab/)
        - Agentic engine / automation
        - Frida hooks
        - Reporting
        - Documentation / knowledge base
        - CI / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought about.
