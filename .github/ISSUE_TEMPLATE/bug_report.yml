name: 🐛 Bug Report
description: Report a problem with the lab, scripts, or documentation
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        sections below so we can reproduce and fix the issue quickly.

        > ⚠️ **Scope reminder:** os-lab is for testing apps you own or are
        > explicitly authorized to assess. Do not attach artifacts, logs, or
        > sample binaries from third-party apps you are not permitted to share.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing issues and this has not been reported.
          required: true
        - label: This concerns apps/targets I own or am authorized to test.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the lab is affected?
      options:
        - Android lab (lab/)
        - iOS lab (ios-lab/)
        - Windows runbook (lab.ps1)
        - Python scripts / orchestrator
        - Frida hooks
        - CI / workflows
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS / environment
      placeholder: "e.g. Ubuntu 24.04 + KVM, Windows 11 non-admin, macOS 15 (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any error output. This will be formatted as code.
      render: shell
