name: release-win

# Builds the Windows installers on a GitHub-hosted runner (free for public repositories), optionally
# signs them through SignPath Foundation, and uploads them to the release app-v<version>.
# Signing runs only when the repository variable SIGNPATH_ORGANIZATION_ID is set (see app/SIGNING.md);
# without it the installers are published unsigned, like the local app/scripts/release-win.ps1 run.

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the installers to the GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the unsigned installers
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund --prefix dashboard
          ./app/scripts/release-win.ps1 -NoSign

      - name: Read the version
        id: v
        shell: pwsh
        run: |
          $v = (node -p "require('./app/src-tauri/tauri.conf.json').version").Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Stage the installers for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item "app/out/${{ steps.v.outputs.version }}/*.exe", "app/out/${{ steps.v.outputs.version }}/*.msi" unsigned/

      - name: Upload the unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: os-lab-windows-unsigned
          path: unsigned/*

      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'os-lab' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect the files to ship
        shell: pwsh
        run: |
          $dir = if ($env:SIGN -eq 'true') { 'signed' } else { 'unsigned' }
          New-Item -ItemType Directory -Force ship | Out-Null
          Copy-Item "$dir/*" ship/
          $utf8 = New-Object Text.UTF8Encoding($false)
          foreach ($f in Get-ChildItem ship -Include *.exe, *.msi -Recurse) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($env:SIGN -eq 'true' -and $sig.Status -ne 'Valid') { throw "$($f.Name): signature is $($sig.Status), expected Valid" }
            Write-Host "$($f.Name): $($sig.Status)"
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            [IO.File]::WriteAllText("$($f.FullName).sha256", "$hash  $($f.Name)`n", $utf8)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: os-lab-windows
          path: ship/*

      - name: Publish to the release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "app-v${{ steps.v.outputs.version }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "os-lab app ${{ steps.v.outputs.version }}" --notes "os-lab desktop app ${{ steps.v.outputs.version }}. One installer per platform, each with a .sha256 file. Needs Python 3.9+ on PATH."
          }
          gh release upload $tag (Get-ChildItem ship).FullName --clobber
