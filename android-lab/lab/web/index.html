<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>android-lab — Mobile Security Console</title>
<script>
  /* Apply the saved or system theme before first paint */
  (function () {
    var mode;
    try { mode = localStorage.getItem("oslab.theme"); } catch (e) {}
    if (mode !== "light" && mode !== "dark") {
      mode = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-mode", mode);
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="content scroll" id="content">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="mobile-only" style="gap:4px">
          <button type="button" class="btn ghost icon" id="open-nav" aria-label="Open navigation" data-icon="menu"></button>
          <button type="button" class="btn ghost icon" id="open-search" aria-label="Search" data-icon="search"></button>
        </div>
        <span data-icon="shield" class="shield-slot"></span>
        <span id="crumb"></span>
        <h1 id="page-title">android-lab · Mobile Security Console</h1>
        <div class="topbar-end">
          <span class="lab-state with-dot"><span class="dot" id="lab-dot"></span><span id="lab-state">Connecting…</span></span>
          <button type="button" class="btn outline icon" id="theme-toggle" aria-label="Toggle theme"></button>
        </div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<dialog class="dlg drawer" id="drawer" aria-label="Navigation"></dialog>

<dialog class="dlg spotlight" id="spotlight" aria-label="Search">
  <div class="spot-input">
    <span data-icon="search"></span>
    <input id="spot-q" type="text" placeholder="Search pages, workflows and actions…" autocomplete="off" spellcheck="false" aria-controls="spot-list">
    <kbd class="small">Esc</kbd>
  </div>
  <ul class="spot-list scroll" id="spot-list" role="listbox"></ul>
  <div class="spot-foot"><span>↑↓ to move</span><span>↵ to open</span><span>Ctrl/⌘ K to toggle</span></div>
</dialog>

<input type="file" id="apk-file-picker" accept=".apk" hidden>
<script src="/static/app.js"></script>
</body>
</html>
