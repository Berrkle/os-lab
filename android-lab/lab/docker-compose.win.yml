# Windows & Podman-Compatible Mobile Security Lab Stack
# Enables running MobSF, mitmproxy, and RE tools without Linux-only /dev/kvm.
# Profiles:
#   default / static : mobsf, mitmproxy, tools (runs without KVM)
#   kvm              : android emulator (requires KVM host / VM)

name: android-lab-win

services:
  # MobSF (Static + Dynamic scanner): runs cleanly without /dev/kvm
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: lab-mobsf
    ports:
      - "8000:8000"
    environment:
      MOBSF_API_KEY: "${MOBSF_API_KEY:-compact-lab-key}"
    volumes:
      - mobsf_data:/home/mobsf
    networks: [labnet]

  # mitmproxy / mitmweb: Traffic interception & live UI
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: lab-mitmproxy
    command: mitmweb --set block_global=false --set web_host=0.0.0.0 -w /artifacts/flows.mitm
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - mitm_data:/home/mitmproxy/.mitmproxy
      - ./artifacts:/artifacts
    networks: [labnet]

  # RE Tools (JADX, apktool, radare2, androguard): runs without KVM
  tools:
    image: cryptax/android-re:latest
    container_name: lab-tools
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - ./artifacts:/work
      - ./apks:/apks:ro
    networks: [labnet]

  # Docker-Android (Optional: requires host with KVM or nested KVM VM)
  android:
    image: budtmo/docker-android:${ANDROID_TAG:-emulator_11.0}
    container_name: lab-android
    profiles: ["kvm"]
    ports:
      - "6080:6080"
      - "5554:5554"
      - "5555:5555"
    environment:
      EMULATOR_DEVICE: "${EMULATOR_DEVICE:-Samsung Galaxy S10}"
      WEB_VNC: "true"
      # Docker-Android reports usage analytics (incl. city/country via ipinfo.io) to its
      # maintainers unless disabled; os-lab opts out by default. See docs/legal/PRIVACY.md.
      USER_BEHAVIOR_ANALYTICS: "${DOCKER_ANDROID_ANALYTICS:-false}"
    devices:
      - /dev/kvm
    volumes:
      - android_data:/home/androidusr
      - ./apks:/apks:ro
    networks: [labnet]

networks:
  labnet:

volumes:
  android_data:
  mobsf_data:
  mitm_data:
